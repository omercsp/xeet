include: [xeet_base.yaml]
tests:
  - name: debug_test_001
    short_desc: |
      debug test. use print and sleep to test proper output tailing by xeet.
    run:
      - cmd: |
          for i in \{1..3}; do
            sleep 0.1
            echo $i
          done
        expected_stdout: |
          1
          2
          3
        use_shell: true
    groups: [debug, passing]
  - name: debug_test_002_fail
    short_desc: returns true, always passes
    run:
      - cmd: |
          for i in \{1..3}; do
            sleep 0.1
            echo $i
          done
        expected_stdout: |
          1
          3
          3
        use_shell: true
    groups: [debug, failing]
