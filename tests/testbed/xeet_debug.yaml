include: [xeet_base.yaml]
# The commands below run through the default shell (use_shell), which is
# /bin/sh. Its identity is system dependent, e.g. dash on Debian/Ubuntu and
# bash elsewhere. Avoid bashisms such as brace expansion ({1..3}), which dash
# prints literally, and use seq, which behaves the same under any POSIX shell.
tests:
  - name: debug_test_001
    short_desc: |
      debug test. use print and sleep to test proper output tailing by xeet.
    run:
      - cmd: |
          for i in $(seq 1 3); do
            sleep 0.1
            echo $i
          done
        expected_stdout: |
          1
          2
          3
        use_shell: true
    groups: [debug, passing]
  - name: debug_test_002_fail
    short_desc: returns true, always passes
    run:
      - cmd: |
          for i in $(seq 1 3); do
            sleep 0.1
            echo $i
          done
        expected_stdout: |
          1
          3
          3
        use_shell: true
    groups: [debug, failing]
